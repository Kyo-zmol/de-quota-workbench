<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#333}canvas{display:block;margin:8px auto;background:#fff}</style></head>
<body><canvas id="cv"></canvas>
<script type="module">
import * as pdfjs from './pdf.mjs';
pdfjs.GlobalWorkerOptions.workerSrc = './pdf.worker.mjs';
const q = new URLSearchParams(location.search);
const doc = await pdfjs.getDocument({ url: q.get('file'), isEvalSupported: false }).promise;
const page = await doc.getPage(+q.get('page') || 6);
const vp = page.getViewport({ scale: +(q.get('scale') || 2) });
const cv = document.getElementById('cv');
cv.width = vp.width; cv.height = vp.height;
await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
document.title = 'rendered';
</script></body></html>
